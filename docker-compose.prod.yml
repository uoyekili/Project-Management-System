# Production stack. Requires .env and backend/.env (cp .env.example .env; cp backend/.env.example backend/.env), then:
#   docker compose -f docker-compose.prod.yml up -d --build
name: taskflow-prod

# Container-network overrides; everything else comes from backend/.env
x-backend-env: &backend-env
  ENVIRONMENT: production
  BACKEND_WORKERS: ${BACKEND_WORKERS:?BACKEND_WORKERS is required in .env}
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_HOST_PORT: 3306
  MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required in .env}
  MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required in .env}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in .env}
  TZ: ${TZ:?TZ is required in .env}
  PYTHONPATH: /app

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required in .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in .env}
      TZ: ${TZ:?TZ is required in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-migrate:
    image: taskflow-backend:prod
    # Built by the backend service; never pulled.
    pull_policy: never
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment: *backend-env
    entrypoint: ["python", "scripts/migrate_db.py"]

  db-seed:
    image: mysql:8.4
    restart: "no"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required in .env}
      SEED_SQL_PATH: /seed/backup.sql
    volumes:
      - ./database:/seed:ro
    entrypoint: ["/bin/bash", "/seed/seed.sh"]

  backend:
    image: taskflow-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment: *backend-env
    ports:
      - "${BACKEND_HOST_PORT:-8000}:${BACKEND_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-8000}/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: taskflow-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Browser swaps localhost for the current hostname (services/api/core.ts).
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
        NEXT_PUBLIC_API_PORT: ${BACKEND_HOST_PORT:-8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL_INTERNAL: http://backend:${BACKEND_PORT:-8000}
      PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:${FRONTEND_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT} >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql_data_prod:
  redis_data_prod:
